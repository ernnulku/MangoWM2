italic_font      auto
bold_italic_font auto
font_size        9.0

# --- Window & Transparency (Monochrome Stealth) ---
background_opacity         0.6
background_blur            0
window_padding_width       0
hide_window_decorations    yes
confirm_os_window_close    0
remember_window_size       no
initial_window_width       115c
initial_window_height      32c

# --- Borders & Layouts ---
enabled_layouts            splits,stack
window_border_width        0pt
draw_minimal_borders       yes
active_border_color        #a8a8a8
inactive_border_color      #242424
bell_border_color          #ffffff

# --- Cursor ---
cursor                     #e0e0e0
cursor_text_color          #0d0d0d
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_trail               3

# --- Tab Bar (Sleek Minimalist Monochrome) ---
tab_bar_edge               top
tab_bar_style              powerline
tab_powerline_style        slanted
tab_bar_min_tabs           1
active_tab_foreground      #0d0d0d
active_tab_background      #c4c4c4
active_tab_font_style      bold
inactive_tab_foreground    #7a7a7a
inactive_tab_background    #1a1a1a
inactive_tab_font_style  normal
tab_bar_background         #0d0d0d

# --- Color Palette (Pure Monochrome Grayscale) ---
foreground                 #e0e0e0
background                 #0d0d0d
selection_foreground       #0d0d0d
selection_background       #c4c4c4

# URLs
url_color                  #b8b8b8
url_style                  curly

# Black (Deep Charcoal)
color0                     #171717
color8                     #4d4d4d

# Red (Replaced with Medium-Light Gray for contrast)
color1                     #9e9e9e
color9                     #bdbdbd

# Green (Replaced with Crisp Silver)
color2                     #b5b5b5
color10                    #d4d4d4

# Yellow (Replaced with Soft Ash)
color3                     #a8a8a8
color11                    #c9c9c9

# Blue (Replaced with Slate Gray)
color4                     #8f8f8f
color12                    #b0b0b0

# Magenta (Replaced with Muted Smoke)
color5                     #969696
color13                    #b8b8b8

# Cyan (Replaced with Pale Mist)
color6                     #ababab
color14                    #cfcfcf

# White (Pure Highlights)
color7                     #cccccc
color15                    #f5f5f5

# --- Behavior & Quality of Life ---
enable_audio_bell          no
copy_on_select             yes
scrollback_lines           10000
mouse_map right_click ungrabbed paste_from_clipboard
